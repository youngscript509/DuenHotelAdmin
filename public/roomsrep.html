<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport des Ventes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .container {
            margin-top: 30px;
            max-width: 1350px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        #filter-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .summary-box {
            background: #fff;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .export-btn {
            margin-top: 15px;
        }

        .product-list {
            font-size: 14px;
            color: #555;
            margin: 0;
            padding-left: 15px;
        }

        .summary-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .summary-block {
            flex: 1;
            min-width: 250px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1050;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-dialog {
            background: white;
            border-radius: 10px;
            width: min(100%, 420px);
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Rapport des Ventes</h2>

        <!-- Filtres -->
        <div id="filter-section" class="mb-4">
            <div class="row">
                <div class="col-md-4">
                    <label for="date" class="form-label">Filtrer par Date :</label>
                    <input type="date" id="date" class="form-control">
                </div>
                <div class="col-md-4">
                    <label for="user" class="form-label">Utilisateur :</label>
                    <select id="user" class="form-select">
                        <option value="">Tous</option>
                    </select>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button id="exportPDF" class="btn btn-danger w-100 export-btn">Exporter en PDF</button>
                </div>
            </div>
        </div>

        <!-- Tableau principal -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="reportTable">
                <thead class="table-dark">
                    <tr>
                        <th>Infos</th>
                        <th>Produits</th>
                        <th>Total (Gdes)</th>
                        <th>Total (US)</th>
                        <th>Statut de Paiement</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="reportBody">
                    <tr>
                        <td colspan="8" class="text-center">Chargement des données...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Bilan -->
        <div class="summary-box">
            <h4>Bilan du Jour</h4>
            <div class="summary-section">
                <div class="summary-block">
                    <p><strong>Total en Gdes :</strong> <span id="totalGdes">0</span></p>
                    <p><strong>Total en US :</strong> <span id="totalUs">0</span></p>
                </div>
                <div class="summary-block">
                    <h5>Par Méthode de Paiement :</h5>
                    <ul id="paymentSummary"></ul>
                </div>
                <div class="summary-block">
                    <h5>Par Statut de Paiement :</h5>
                    <ul id="statusSummary"></ul>
                </div>
            </div>
        </div>
    </div>

    <div id="discountModal" class="modal-overlay">
        <div class="modal-dialog">
            <h5 class="mb-3">Appliquer un discount</h5>
            <div class="mb-3">
                <label for="discountAmount" class="form-label">Montant du discount</label>
                <input type="number" id="discountAmount" class="form-control" min="1" step="0.01">
            </div>
            <div class="mb-3">
                <label for="discountCurrencySelect" class="form-label">Devise</label>
                <select id="discountCurrencySelect" class="form-select"></select>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <button type="button" id="cancelDiscount" class="btn btn-secondary">Annuler</button>
                <button type="button" id="confirmDiscount" class="btn btn-primary">Appliquer</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <!-- Firebase & Config -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <script>
      

        const reportBody = document.getElementById("reportBody");
        const userSelect = document.getElementById("user");
        const discountModal = document.getElementById("discountModal");
        const discountAmountInput = document.getElementById("discountAmount");
        const discountCurrencySelect = document.getElementById("discountCurrencySelect");
        const confirmDiscountBtn = document.getElementById("confirmDiscount");
        const cancelDiscountBtn = document.getElementById("cancelDiscount");
        let pendingSaleId = null;

        function populateCurrencyOptions() {
            discountCurrencySelect.innerHTML = "";
            ["Gdes", "US"].forEach(currency => {
                const option = document.createElement("option");
                option.value = currency;
                option.textContent = currency;
                discountCurrencySelect.appendChild(option);
            });
            discountCurrencySelect.value = "Gdes";
        }

        function closeDiscountModal() {
            discountModal.classList.remove("show");
            pendingSaleId = null;
        }

        function openDiscountModal(saleId) {
            pendingSaleId = saleId;
            discountAmountInput.value = "";
            populateCurrencyOptions();
            discountModal.classList.add("show");
        }

        cancelDiscountBtn.addEventListener("click", closeDiscountModal);

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && discountModal.classList.contains("show")) {
                closeDiscountModal();
            }
        });

        const discountDialog = document.querySelector("#discountModal .modal-dialog");
        if (discountDialog) {
            discountDialog.addEventListener("click", (event) => {
                event.stopPropagation();
            });
            discountDialog.addEventListener("mousedown", (event) => {
                event.stopPropagation();
            });
        }

        confirmDiscountBtn.addEventListener("click", async () => {
            if (!pendingSaleId) return;

            const discount = discountAmountInput.value;
            const currency = discountCurrencySelect.value;

            if (discount === "" || isNaN(discount) || Number(discount) <= 0) {
                alert("Montant invalide.");
                return;
            }

            if (!["Gdes", "US"].includes(currency)) {
                alert("Veuillez sélectionner une devise.");
                return;
            }

            const saleRef = db.collection("globalSalesRoom").doc(pendingSaleId);
            const saleDoc = await saleRef.get();
            if (!saleDoc.exists) {
                alert("Vente introuvable.");
                closeDiscountModal();
                return;
            }

            const saleData = saleDoc.data();
            let newTotalGdes = saleData.totalGdes || 0;
            let newTotalUs = saleData.totalUs || 0;

            if (currency === "Gdes") {
                newTotalGdes -= Number(discount);
                if (newTotalGdes < 0) newTotalGdes = 0;
            } else {
                newTotalUs -= Number(discount);
                if (newTotalUs < 0) newTotalUs = 0;
            }

            await saleRef.update({
                totalGdes: newTotalGdes,
                totalUs: newTotalUs,
                discountApplied: true,
                discountAmount: Number(discount),
                discountCurrency: currency
            });

            alert(`Discount de ${discount} ${currency} appliqué avec succès.`);
            closeDiscountModal();
            displayReports();
        });

        // ✅ Charger les utilisateurs
        db.collection("users").get().then(snapshot => {
            snapshot.forEach(doc => {
                const option = document.createElement("option");
                option.value = doc.data().name;
                option.textContent = doc.data().name;
                userSelect.appendChild(option);
            });
        });

        // ✅ Affichage des rapports
        async function displayReports() {
            const selectedDate = document.getElementById("date").value;
            const selectedUser = userSelect.value;

            let query = db.collection("globalSalesRoom");
            if (selectedDate) query = query.where("date", "==", selectedDate);
            if (selectedUser) query = query.where("sellerName", "==", selectedUser);

            const snapshot = await query.get();
            reportBody.innerHTML = "";

            let totalGdes = 0;
            let totalUs = 0;
            const paymentMethods = {};
            const paymentStatus = {};

            if (snapshot.empty) {
                reportBody.innerHTML = "<tr><td colspan='8' class='text-center'>Aucune donnée trouvée</td></tr>";
                document.getElementById("totalGdes").textContent = 0;
                document.getElementById("totalUs").textContent = 0;
                document.getElementById("paymentSummary").innerHTML = '';
                document.getElementById("statusSummary").innerHTML = '';
                return;
            }

            snapshot.forEach(doc => {
                const data = doc.data();
                const saleId = doc.id;

                // Totaux
                totalGdes += data.totalGdes || 0;
                totalUs += data.totalUs || 0;

                // Par méthode
                if (!paymentMethods[data.paymentmeth]) {
                    paymentMethods[data.paymentmeth] = { gdes: 0, us: 0 };
                }
                paymentMethods[data.paymentmeth].gdes += data.totalGdes || 0;
                paymentMethods[data.paymentmeth].us += data.totalUs || 0;

                // Par statut
                if (!paymentStatus[data.paymentStatut]) {
                    paymentStatus[data.paymentStatut] = { gdes: 0, us: 0 };
                }
                paymentStatus[data.paymentStatut].gdes += data.totalGdes || 0;
                paymentStatus[data.paymentStatut].us += data.totalUs || 0;

                // Produits en liste
                let productsHTML = "<ul class='product-list'>";
                (data.products || []).forEach(p => {
                    productsHTML += `<li>${p.item} - (Quantité: ${p.quantity}) - prix unitaire: ${p.price || 0} ${p.currency || ''}</li>`;
                });
                productsHTML += "</ul>";

                const tr = document.createElement("tr");
                tr.innerHTML = `
                <td>Client: ${data.customerName || '-'}<br>Vendeur: ${data.sellerName || '-'}<br>Date: ${data.date || '-'}<br>${data.typeOperation || ''} ${data.checkinDate ? `- ${data.checkinDate}` : ''}</td>
                <td>${productsHTML}</td>
                <td>${data.totalGdes || 0}</td>
                <td>${data.totalUs || 0}</td>
                <td>${data.paymentmeth || '-'} / ${data.paymentStatut || '-'}</td>
                <td><button class="btn btn-sm btn-primary" onclick="applyDiscount('${saleId}')">Discount</button></td>
            `;
                reportBody.appendChild(tr);
            });

            // Affichage des bilans
            document.getElementById("totalGdes").textContent = totalGdes;
            document.getElementById("totalUs").textContent = totalUs;

            const paymentSummary = document.getElementById("paymentSummary");
            paymentSummary.innerHTML = '';
            for (const method in paymentMethods) {
                paymentSummary.innerHTML += `<li>${method}: ${paymentMethods[method].gdes} Gdes | ${paymentMethods[method].us} US</li>`;
            }

            const statusSummary = document.getElementById("statusSummary");
            statusSummary.innerHTML = '';
            for (const status in paymentStatus) {
                statusSummary.innerHTML += `<li>${status}: ${paymentStatus[status].gdes} Gdes | ${paymentStatus[status].us} US</li>`;
            }
        }

        document.getElementById("date").addEventListener("change", displayReports);
        document.getElementById("user").addEventListener("change", displayReports);

        async function applyDiscount(saleId) {
            const user = firebase.auth().currentUser;
            if (!user) {
                alert("Vous devez être connecté pour appliquer un discount.");
                return;
            }

            const userDoc = await db.collection("users").doc(user.uid).get();
            const userData = userDoc.data();

            if (!["Admin", "DG", "Manager"].includes(userData.role)) {
                alert("Vous n'avez pas la permission d'appliquer un discount.");
                return;
            }

            openDiscountModal(saleId);
        }

        // ✅ Export PDF
        document.getElementById("exportPDF").addEventListener("click", () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.text("Rapport des Ventes", 14, 10);
            const rows = [];
            document.querySelectorAll("#reportBody tr").forEach(row => {
                const cols = row.querySelectorAll("td");
                const rowData = Array.from(cols).slice(0, 7).map(td => td.textContent);
                rows.push(rowData);
            });

            doc.autoTable({
                head: [['Client', 'Utilisateur', 'Date', 'Total (Gdes)', 'Total (US)', 'Méthode', 'Statut']],
                body: rows
            });

            doc.save("rapport.pdf");
        });

        // Charger le rapport du jour par défaut
        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("date").value = today;
            displayReports();
        };
    </script>

</body>

</html>
