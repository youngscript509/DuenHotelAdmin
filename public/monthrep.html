<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Duen-Hotel - Rapport Mensuel</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background: #f4f4f4;
    }

    .container {
      margin-top: 50px;
    }

    #resultsContainer {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }

    table th,
    table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    table th {
      background-color: #007bff;
      color: #fff;
    }

    .total-row {
      background-color: #e9ecef;
      font-weight: bold;
    }

    .btn-primary,
    .btn-success {
      margin: 10px 5px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2 class="text-center">Rapport Mensuel des Ventes</h2>
    <div class="row">
      <div class="col-md-4 offset-md-4 text-center">
        <input class="form-control" type="month" id="month" name="month" />
      </div>
    </div>
    <div class="text-center">
      <button id="exportPdfBtn" class="btn btn-primary">Exporter en PDF</button>
      <button id="exportExcelBtn" class="btn btn-success">Exporter en Excel</button>
    </div>

    <div id="resultsContainer"></div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- html2pdf & SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    document.getElementById('month').value = `${year}-${month}`;

    let lastReportData = [];

    async function filterSalesByMonth() {
      const selectedMonth = document.getElementById('month').value;
      if (!selectedMonth) return;

      lastReportData = [];

      const snapshot = await db.collection('globalSales').get();

      const productSummary = {};

      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.date && data.date.startsWith(selectedMonth)) {
          data.products.forEach(prod => {
            const item = prod.item;
            const price = parseFloat(prod.price);
            const qty = parseInt(prod.quantity);
            const currency = prod.currency;

            if (!productSummary[item]) {
              productSummary[item] = {
                description: item,
                gdesPrice: 0, gdesQty: 0, gdesTotal: 0,
                usPrice: 0, usQty: 0, usTotal: 0
              };
            }

            if (currency === "Gdes") {
              productSummary[item].gdesPrice = price;
              productSummary[item].gdesQty += qty;
              productSummary[item].gdesTotal += price * qty;
            } else {
              productSummary[item].usPrice = price;
              productSummary[item].usQty += qty;
              productSummary[item].usTotal += price * qty;
            }
          });
        }
      });

      // Calcul des totaux généraux
      let totalGdesQty = 0, totalGdesRev = 0, totalUsQty = 0, totalUsRev = 0;

      let html = `<h3 class="text-center">Rapport Cumulé (${selectedMonth})</h3>`;
      html += `<table><thead>
        <tr>
          <th>Description</th>
          <th>Prix Unit (Gdes)</th>
          <th>Qté (Gdes)</th>
          <th>Total Rev (Gdes)</th>
          <th>Prix Unit (US)</th>
          <th>Qté (US)</th>
          <th>Total Rev (US)</th>
        </tr>
      </thead><tbody>`;

      Object.values(productSummary).forEach(prod => {
        html += `<tr>
          <td>${prod.description}</td>
          <td>${prod.gdesPrice.toFixed(2)}</td>
          <td>${prod.gdesQty}</td>
          <td>${prod.gdesTotal.toFixed(2)}</td>
          <td>${prod.usPrice.toFixed(2)}</td>
          <td>${prod.usQty}</td>
          <td>${prod.usTotal.toFixed(2)}</td>
        </tr>`;

        totalGdesQty += prod.gdesQty;
        totalGdesRev += prod.gdesTotal;
        totalUsQty += prod.usQty;
        totalUsRev += prod.usTotal;

        lastReportData.push(prod);
      });

      // Ligne de total général
      html += `<tr class="total-row">
        <td>Total Général</td>
        <td>-</td>
        <td>${totalGdesQty}</td>
        <td>${totalGdesRev.toFixed(2)} Gdes</td>
        <td>-</td>
        <td>${totalUsQty}</td>
        <td>${totalUsRev.toFixed(2)} Us</td>
      </tr>`;

      html += `</tbody></table>`;
      document.getElementById("resultsContainer").innerHTML = html;
    }

    document.getElementById("month").addEventListener("change", filterSalesByMonth);
    filterSalesByMonth();

    // Export PDF
    document.getElementById("exportPdfBtn").addEventListener("click", () => {
      const element = document.getElementById("resultsContainer");
      const selectedMonth = document.getElementById('month').value;
      const opt = {
        margin: 0.5,
        filename: `Rapport_${selectedMonth}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
      };
      html2pdf().set(opt).from(element).save();
    });

    // Export Excel
    document.getElementById("exportExcelBtn").addEventListener("click", () => {
      if (lastReportData.length === 0) {
        alert("Aucun rapport à exporter !");
        return;
      }
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(lastReportData);
      XLSX.utils.book_append_sheet(wb, ws, "Rapport");
      XLSX.writeFile(wb, `Rapport_${document.getElementById('month').value}.xlsx`);
    });
  </script>
</body>

</html>
